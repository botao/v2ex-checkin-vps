<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · V2EX 自动签到</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-panel">
    <div class="logo">V</div>
    <p class="eyebrow">VPS CONTROL</p>
    <h1>V2EX 自动签到</h1>
    <div class="notice error" id="login-error" hidden>管理员密码不正确，请重试。</div>
    <form method="post" action="/login">
      <input type="hidden" name="username" value="admin" autocomplete="username">
      <label class="field"><span>管理员密码</span><input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="button primary wide" type="submit">进入控制台</button>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
