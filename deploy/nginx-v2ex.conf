server {
    listen 80;
    listen [::]:80;
    server_name v2ex.taotao.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/v2ex-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://v2ex.taotao.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v2ex.taotao.dev;

    ssl_certificate /etc/letsencrypt/live/v2ex.taotao.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2ex.taotao.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:V2EXSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
